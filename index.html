<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew Fadoul — Apps</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; line-height: 1.6; padding: 40px 20px; }
        .container { max-width: 680px; margin: 0 auto; }
        header { margin-bottom: 48px; }
        header h1 { font-size: 2em; font-weight: 700; letter-spacing: -0.5px; }
        header p { color: #6e6e73; margin-top: 6px; }
        .app-card { background: #fff; border-radius: 18px; padding: 28px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .app-card h2 { font-size: 1.2em; font-weight: 700; margin-bottom: 4px; }
        .app-card .tagline { color: #6e6e73; font-size: 0.95em; margin-bottom: 16px; }
        .app-links { display: flex; flex-wrap: wrap; gap: 10px; }
        .app-links a { display: inline-block; padding: 7px 16px; border-radius: 20px; font-size: 0.875em; font-weight: 600; text-decoration: none; transition: opacity 0.2s; }
        .app-links a:hover { opacity: 0.75; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
        .rollapaya-accent { background: #FF8C00; color: #fff; }
        .papaya-accent { background: #28A37F; color: #fff; }
        footer { margin-top: 48px; font-size: 0.8em; color: #6e6e73; border-top: 1px solid #d2d2d7; padding-top: 24px; }
        footer a { color: #6e6e73; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Matthew Fadoul</h1>
            <p>iOS app support and policies</p>
        </header>

        <div class="app-card">
            <h2>Rollapaya</h2>
            <p class="tagline">The tropical way to roll dice.</p>
            <div class="app-links">
                <a href="https://mfadoul.github.io/rollapaya-support/" class="rollapaya-accent">Support</a>
                <a href="https://mfadoul.github.io/rollapaya-support/privacy.html" class="btn-secondary">Privacy Policy</a>
                <a href="https://mfadoul.github.io/rollapaya-support/terms.html" class="btn-secondary">EULA &amp; Terms</a>
            </div>
        </div>

        <div class="app-card">
            <h2>Papaya Peg</h2>
            <p class="tagline">Classic mini games on iOS.</p>
            <div class="app-links">
                <a href="https://mfadoul.github.io/papaya-peg-support/" class="papaya-accent">Support</a>
                <a href="https://mfadoul.github.io/papaya-peg-support/privacy.html" class="btn-secondary">Privacy Policy</a>
                <a href="https://mfadoul.github.io/papaya-peg-support/terms.html" class="btn-secondary">EULA &amp; Terms</a>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Matthew Fadoul &nbsp;&middot;&nbsp; <a href="/app-ads.txt">app-ads.txt</a></p>
        </footer>
    </div>
</body>
</html>
